<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAP session sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #0b1530;
      --color-ink:    #e6eeff;
      --color-muted:  #9fb3d9;
      --color-accent: #22d3ee;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Remote Access Protocol</p>
    <h1>Handshake, then one long-lived session</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-sequence-title session-sequence-desc">
        <title id="session-sequence-title">RAP session message sequence</title>
        <desc id="session-sequence-desc">rapview answers the host challenge with a password hash, receives the screen size, then exchanges frames, input, keepalive pings and clipboard text over the same connection until it closes.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(159,179,217,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9fb3d9"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6ea8ff"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#9fb3d9" stroke-width="1.2"/></marker>
          <marker id="arrow-open-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#6ea8ff" stroke-width="1.2"/></marker>
          <marker id="arrow-open-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#22d3ee" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#0b1530"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

        <!-- Lifelines -->
        <line x1="240" y1="96" x2="240" y2="604" stroke="rgba(230,238,255,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="640" y1="96" x2="640" y2="604" stroke="rgba(230,238,255,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Actors -->
        <rect x="160" y="40" width="160" height="56" rx="6" fill="#0b1530"/>
        <rect x="160" y="40" width="160" height="56" rx="6" fill="rgba(110,168,255,0.06)" stroke="rgba(159,179,217,0.45)" stroke-width="1"/>
        <text x="240" y="64" fill="#e6eeff" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rapview</text>
        <text x="240" y="80" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">PC A · viewer</text>

        <rect x="560" y="40" width="160" height="56" rx="6" fill="#0b1530"/>
        <rect x="560" y="40" width="160" height="56" rx="6" fill="rgba(34,211,238,0.07)" stroke="#22d3ee" stroke-width="1"/>
        <text x="640" y="64" fill="#e6eeff" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">raphost</text>
        <text x="640" y="80" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">PC B · host · :7700</text>

        <!-- Handshake -->
        <text x="40" y="132" fill="#6f86b8" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HANDSHAKE</text>

        <line x1="640" y1="148" x2="242" y2="148" stroke="#9fb3d9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="384" y="124" width="112" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="136" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHALLENGE 0x01</text>
        <text x="664" y="151" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">32-byte random nonce</text>

        <line x1="240" y1="188" x2="638" y2="188" stroke="#9fb3d9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="396" y="164" width="88" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="176" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HELLO 0x02</text>
        <text x="664" y="191" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">v1 + sha256(password || nonce)</text>

        <path d="M 640,228 H 242" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <rect x="394" y="204" width="92" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="216" fill="#22d3ee" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OK 0x03 W,H</text>
        <text x="664" y="231" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">screen size; else DENY 0x04</text>
        <text x="664" y="248" fill="#6f86b8" font-size="11" font-family="'Geist Mono', monospace">(bad hash, busy, or 3 fails → 60 s lock)</text>

        <!-- Loop fragment -->
        <rect x="216" y="276" width="448" height="312" rx="4" fill="rgba(230,238,255,0.04)" stroke="rgba(230,238,255,0.22)" stroke-width="1"/>
        <rect x="216" y="276" width="50" height="18" rx="2" fill="#0b1530" stroke="rgba(230,238,255,0.22)" stroke-width="1"/>
        <text x="241" y="289" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="276" y="289" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[while connected]</text>

        <!-- FRAME (async, host -> viewer) -->
        <line x1="640" y1="324" x2="242" y2="324" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow-open-accent)"/>
        <rect x="398" y="300" width="84" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="312" fill="#22d3ee" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FRAME 0x10</text>
        <text x="688" y="327" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">JPEG every 100 ms, skipped if busy</text>

        <!-- INPUT (async, viewer -> host) -->
        <line x1="240" y1="364" x2="638" y2="364" stroke="#6ea8ff" stroke-width="1.2" marker-end="url(#arrow-open-link)"/>
        <rect x="384" y="340" width="112" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="352" fill="#6ea8ff" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOUSE/KEY 0x2x</text>
        <text x="688" y="367" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">only while CAPTURED → SendInput</text>

        <!-- RELEASE -->
        <line x1="240" y1="404" x2="638" y2="404" stroke="#6ea8ff" stroke-width="1.2" marker-end="url(#arrow-open-link)"/>
        <rect x="390" y="380" width="100" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="392" fill="#6ea8ff" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RELEASE 0x24</text>
        <text x="688" y="407" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">Ctrl+Alt+Home → host ups held keys</text>

        <!-- PING / PONG -->
        <line x1="240" y1="444" x2="638" y2="444" stroke="#9fb3d9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="402" y="420" width="76" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="432" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PING 0x30</text>
        <text x="688" y="447" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">every 2 s from the viewer</text>

        <path d="M 640,484 H 242" fill="none" stroke="#9fb3d9" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="402" y="460" width="76" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="472" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PONG 0x31</text>
        <text x="688" y="487" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">6 s silence on either side ends it</text>

        <!-- CLIPBOARD both ways -->
        <line x1="240" y1="524" x2="638" y2="524" stroke="#9fb3d9" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="384" y="500" width="112" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="512" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIPBOARD 0x40</text>
        <line x1="640" y1="564" x2="242" y2="564" stroke="#9fb3d9" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="384" y="540" width="112" height="16" rx="2" fill="#0b1530"/>
        <text x="440" y="552" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIPBOARD 0x40</text>
        <text x="688" y="547" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace">on local change, text ≤ 256 KB</text>

        <!-- Legend strip -->
        <line x1="40" y1="624" x2="960" y2="624" stroke="rgba(159,179,217,0.18)" stroke-width="0.8"/>
        <text x="40" y="652" fill="#9fb3d9" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <line x1="120" y1="649" x2="148" y2="649" stroke="#9fb3d9" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="156" y="652" fill="#9fb3d9" font-size="11" font-family="'Geist', sans-serif">Request</text>
        <line x1="230" y1="649" x2="258" y2="649" stroke="#9fb3d9" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="266" y="652" fill="#9fb3d9" font-size="11" font-family="'Geist', sans-serif">Reply</text>
        <line x1="330" y1="649" x2="358" y2="649" stroke="#9fb3d9" stroke-width="1.2" marker-end="url(#arrow-open)"/>
        <text x="366" y="652" fill="#9fb3d9" font-size="11" font-family="'Geist', sans-serif">One-way message</text>
        <line x1="490" y1="649" x2="518" y2="649" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="526" y="652" fill="#9fb3d9" font-size="11" font-family="'Geist', sans-serif">Session start / screen frames</text>
        <line x1="730" y1="649" x2="758" y2="649" stroke="#6ea8ff" stroke-width="1.2" marker-end="url(#arrow-open-link)"/>
        <text x="766" y="652" fill="#9fb3d9" font-size="11" font-family="'Geist', sans-serif">Input</text>
      </svg>
    </div>
  </div>
</body>
</html>
